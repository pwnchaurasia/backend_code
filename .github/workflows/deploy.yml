name: Backend Release Deployment

# ==============================================================================
# TRIGGERS:
# 1. push: Triggers automatically when pushing/creating any branch matching 'release/*'
# 2. workflow_dispatch: Enables manual execution from the GitHub Web UI ("Run workflow" button)
# ==============================================================================
on:
  push:
    branches:
      - 'release/*'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      runner:
        description: 'Runner label (use self-hosted for Azure runner or ubuntu-latest for fallback test)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

# Permissions configuration for security
permissions:
  contents: read
  id-token: write # Required if using Azure OIDC authentication

jobs:
  # ============================================================================
  # BUILD & TEST STAGE
  # ============================================================================
  build-and-test:
    name: Build & Verify Backend
    # Uses Azure runner (self-hosted). When triggered manually via UI, the selected runner is used.
    # Note: If your Azure runner has custom labels (e.g., [self-hosted, azure]), you can specify them here.
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: 4. Install backend dependencies
        run: |
          echo "Syncing dependencies with uv..."
          uv sync

      - name: 5. Verify FastAPI application integrity
        run: |
          echo "Checking FastAPI application startup..."
          uv run python -c "import main; print('Backend loaded successfully!')"

  # ============================================================================
  # DEPLOYMENT STAGE (Demo for Azure)
  # ============================================================================
  deploy:
    name: Deploy to Azure (Demo)
    needs: build-and-test
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    environment:
      name: ${{ inputs.environment || 'staging' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Display Deployment Context
        run: |
          echo "=========================================================="
          echo "🚀 DEMO RELEASE DEPLOYMENT STARTED"
          echo "=========================================================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Target Environment: ${{ inputs.environment || 'staging' }}"
          echo "Executing on Runner: Azure Self-Hosted (${{ runner.name }})"
          echo "=========================================================="

      - name: 3. Simulate Azure Deployment
        run: |
          echo "📦 Packaging FastAPI application..."
          echo "🔑 Authenticating with Azure credentials (Demo placeholder)..."
          echo "☁️ Deploying backend to Azure App Service / Azure Container Apps..."
          sleep 3
          echo "✅ Backend successfully deployed to Azure!"
          echo "🌐 Health check URL: https://api.demo.internal/health"

      # ------------------------------------------------------------------------
