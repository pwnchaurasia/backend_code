name: Backend Release Deployment

# ==============================================================================
# TRIGGERS:
# 1. push: Triggers automatically when pushing/creating any branch matching 'release/*'
# 2. workflow_dispatch: Enables manual execution from the GitHub Web UI ("Run workflow" button)
# ==============================================================================
on:
  push:
    branches:
      - 'release/*'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      runner:
        description: 'Runner label (use self-hosted for Azure runner or ubuntu-latest for testing)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  build-and-deploy:
    name: Build Docker & Deploy Backend
    # Executes on the Azure runner (self-hosted). When triggered manually from UI, can also test with ubuntu-latest.
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    environment:
      name: ${{ inputs.environment || 'staging' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Build Backend Docker Image
        run: |
          echo "🐳 Building FastAPI Docker image..."
          docker build -t backend-app:${{ github.sha }} -t backend-app:latest backend   # monorepo: build context = backend/
          echo "📋 Listing built images:"
          docker images | grep backend-app || true

      - name: 3. Deploy Container to Azure (Demo)
        run: |
          echo "=========================================================="
          echo "🚀 DEPLOYING BACKEND CONTAINER TO AZURE"
          echo "=========================================================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Target Environment: ${{ inputs.environment || 'staging' }}"
          echo "Executing on Runner: Azure Self-Hosted (${{ runner.name }})"
          echo "=========================================================="
          echo "☁️ Starting Docker container on Azure runner..."
          sleep 2
          echo "✅ Backend container successfully built and deployed!"
          echo "🌐 API available at: http://<azure-vm-ip>:8000"

      # ------------------------------------------------------------------------
      # REAL AZURE CONTAINER DEPLOYMENT (Optional Reference):
