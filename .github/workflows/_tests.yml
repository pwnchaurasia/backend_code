name: tests

# Reusable: called by ci.yml (PRs) and later by the release workflow,
# so both run exactly the same tests.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests          # <- this is the status check name the ruleset requires
    runs-on: ubuntu-latest   # GitHub-hosted: PR code never runs on the Azure VM
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"   # same as the Dockerfile
      - run: uv sync --locked      # fails if uv.lock is out of date
      - run: uv run pytest -q
