name: tests

# Reusable: called by ci.yml (PRs) and later by the release workflow,
# so both run exactly the same tests.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests          # check name in the ruleset: "tests / api-tests"
    runs-on: ubuntu-latest   # GitHub-hosted: PR code never runs on the Azure VM
    services:
      postgres:              # real PostgreSQL 16, same engine as Azure
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"   # same as the Dockerfile
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked      # fails if uv.lock is out of date
      - run: uv run pytest -q

  web-build:
    name: web-build          # check name in the ruleset: "tests / web-build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # same as the frontend Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  deploy-config:
    name: deploy-config      # every file release.yml copies to the VM must exist in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          missing=0
          for f in $(grep -o 'cp deploy/[^"]*' .github/workflows/release.yml | sed 's/^cp //'); do
            if [ -f "$f" ]; then echo "ok       $f"; else echo "::error::MISSING $f (copied by release.yml)"; missing=1; fi
          done
          exit $missing
