name: fastapi-demo

services:
  api:
    image: ghcr.io/${IMAGE_OWNER}/fastapi-demo-api:${APP_VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "8000"
    mem_limit: 300m

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 100m

volumes:
  caddy_data:
  caddy_config: